---
# Idempotence check for every role (plan 9.2): `molecule test` converges twice and fails if the
# second run reports any change. Runs in a systemd-enabled Ubuntu 24.04 container.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: infra-noble
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    host_vars:
      infra-noble:
        server_role: all
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
