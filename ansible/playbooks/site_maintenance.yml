---
# site.maintenance (plan 9.2): on or off.
- name: Maintenance mode
  hosts: all
  become: true
  become_user: frappe
  gather_facts: false
  environment:
    PATH: "/home/frappe/.local/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Preflight
      ansible.builtin.include_tasks: tasks/site_preflight.yml

    - name: Set maintenance mode
      ansible.builtin.command:
        argv: [bench, --site, "{{ site }}", set-maintenance-mode, "{{ 'on' if maintenance_on | bool else 'off' }}"]
        chdir: "{{ bench_path }}"
      changed_when: true
