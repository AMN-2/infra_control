---
# site.install_app (A3.5): install an app that is already on the bench into one site.
# Backs up first and stops if the backup fails (plan 13.7, like site.migrate), since
# install-app changes the schema. "already installed" is a no-op, not a failure.
- name: Install app on site
  hosts: all
  become: true
  become_user: frappe
  gather_facts: false
  environment:
    PATH: "/home/frappe/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Preflight
      ansible.builtin.include_tasks: tasks/site_preflight.yml

    - name: Check the app is on the bench
      ansible.builtin.stat:
        path: "{{ bench_path }}/apps/{{ app }}"
      register: app_dir
      failed_when: not app_dir.stat.exists

    - name: Backup before installing
      ansible.builtin.include_tasks: tasks/backup_upload.yml

    - name: Install under maintenance
      block:
        - name: Enable maintenance mode
          ansible.builtin.command:
            argv: [bench, --site, "{{ site }}", set-maintenance-mode, "on"]
            chdir: "{{ bench_path }}"
          changed_when: true

        - name: bench install-app
          ansible.builtin.command:
            argv: [bench, --site, "{{ site }}", install-app, "{{ app }}"]
            chdir: "{{ bench_path }}"
          register: install_result
          changed_when: "'already installed' not in (install_result.stdout | default('') + install_result.stderr | default(''))"
          failed_when: install_result.rc != 0 and 'already installed' not in (install_result.stdout | default('') + install_result.stderr | default(''))
      always:
        - name: Disable maintenance mode
          ansible.builtin.command:
            argv: [bench, --site, "{{ site }}", set-maintenance-mode, "off"]
            chdir: "{{ bench_path }}"
          changed_when: true
