#cloud-config
# Rendered by infra_control.providers.digitalocean.adapter.render_cloud_init() for every droplet
# this controller provisions (plan section 13.2: key-only SSH, no root login, SSH reachable only
# from the controller through the managed firewall). Placeholders: {hostname}, {ssh_user},
# {ssh_public_key}.
hostname: {hostname}
manage_etc_hosts: true
package_update: true
packages:
  - python3
  - python3-apt
users:
  - name: {ssh_user}
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - {ssh_public_key}
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/ssh/sshd_config.d/90-infra-control.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
runcmd:
  - systemctl restart ssh || systemctl restart sshd
  - touch /var/lib/cloud/instance/infra-control-ready
