name: Frontend

on:
  push:
    branches: [develop, main]
    paths: ['frontend/**', 'tests/frontend/**', 'contracts/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'tests/frontend/**', 'contracts/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API client matches contracts/openapi.yaml
        run: npm run check:api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Initial JS budget (250 KB gzipped)
        run: npm run check:size

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the contract mocks (Prism on :4010, realtime replay on :9000)
        working-directory: contracts/mock
        run: |
          npm ci --no-audit --no-fund
          (npm run mock > "$RUNNER_TEMP/prism.log" 2>&1 &)
          (npm run realtime > "$RUNNER_TEMP/realtime.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:4010/api/method/infra_control.api.overview.summary \
              -H 'Authorization: token mock:mock' && curl -fsS -o /dev/null http://127.0.0.1:9000/socket.io/?EIO=4\&transport=polling && break
            sleep 1
          done
          curl -fsS -o /dev/null -H 'Authorization: token mock:mock' http://127.0.0.1:4010/api/method/infra_control.api.overview.summary \
            || { echo "Prism did not come up"; cat "$RUNNER_TEMP/prism.log"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:9000/socket.io/?EIO=4\&transport=polling \
            || { echo "realtime mock did not come up"; cat "$RUNNER_TEMP/realtime.log"; exit 1; }
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
