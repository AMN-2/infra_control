name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FRAPPE_BRANCH: version-15

jobs:
  # -------------------------------------------------------------------------
  # Backend quality: ruff, mypy --strict, unit tests (no Frappe site needed)
  # -------------------------------------------------------------------------
  backend-quality:
    name: Backend quality (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install frappe (import-only, no site) and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install "frappe @ git+https://github.com/frappe/frappe.git@${FRAPPE_BRANCH}"
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict infra_control
        run: mypy --strict infra_control

      - name: pytest (unit)
        run: pytest tests/backend -m "not integration and not contract"

  # -------------------------------------------------------------------------
  # Contract tests: OpenAPI + event schemas are valid and complete; examples validate
  # -------------------------------------------------------------------------
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest (contract)
        run: pytest tests/backend -m contract

      - uses: actions/setup-node@v4
        if: hashFiles('contracts/mock/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/mock/package-lock.json

      - name: Mock server smoke test
        if: hashFiles('contracts/mock/package.json') != ''
        working-directory: contracts/mock
        run: |
          npm ci
          npm run smoke

  # -------------------------------------------------------------------------
  # Frappe integration: install the app on a fresh site and run bench tests
  # -------------------------------------------------------------------------
  bench-tests:
    name: Frappe site install + bench tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Bench init
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch ${FRAPPE_BRANCH} --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app on a fresh site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app infra_control "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app infra_control
          bench build --app infra_control
        env:
          CI: "Yes"

      - name: bench run-tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app infra_control
        env:
          TYPE: server
