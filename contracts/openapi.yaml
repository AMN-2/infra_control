                        site: { type: string }
                        error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------------------
  # security (A4.1): posture checks and switches (Infra Admin)
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.security.posture:
    get:
      tags: [security]
      operationId: security_posture
      summary: Security posture checks (2FA, admins, keys, masking, audit immutability, scheduler, backups, restore test, off-site controller backup, console sessions)
      responses:
        "200":
          description: Checks and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityPosture" }
              examples:
                default: { $ref: "#/components/examples/SecurityPosture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/method/infra_control.api.security.enable_2fa:
    post:
      tags: [security]
      operationId: security_enable_2fa
      summary: Turn on OTP-app two-factor authentication for Infra Admin and Infra Operator (Infra Admin; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
      responses:
        "200":
          description: Two-factor state after the change
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [two_factor]
                properties:
                  two_factor: { $ref: "#/components/schemas/TwoFactorState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------------------
  # audit
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.audit.list:
    get:
      tags: [audit]
      operationId: audit_list
      summary: Paginated immutable audit log, newest first
      parameters:
        - name: user
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: target_doctype
          in: query
          schema: { $ref: "#/components/schemas/TargetDoctype" }
        - name: target_name
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Page of audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
              examples:
                default: { $ref: "#/components/examples/AuditPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------------------
  # search
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.search.query:
    get:
      tags: [search]
      operationId: search_query
      summary: Command palette search across servers, sites, benches, playbooks, jobs and alerts
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
              examples:
                default: { $ref: "#/components/examples/SearchResults" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

# =============================================================================
  /api/method/infra_control.api.session.boot:
    get:
      tags: [session]
      operationId: session_boot
      summary: Boot data for the current session (what the /infra page injects), for the in-app login (ADR 0008)
      responses:
        "200":
          description: CSRF token, site, user and Infra roles of the session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionBoot" }
              examples:
                default: { $ref: "#/components/examples/SessionBoot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session cookie. POST requests must also send the `X-Frappe-CSRF-Token` header.
    apiToken:
      type: apiKey
      in: header
      name: Authorization
      description: "`token <api_key>:<api_secret>` of a Frappe user with an Infra role."

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: |
        Invalid `Authorization: token` header (Frappe `AuthenticationError`, framework shape). A missing
        or expired session cookie does **not** produce 401; see `Forbidden`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FrappeFrameworkError" }
          example:
            exception: frappe.exceptions.AuthenticationError
            exc_type: AuthenticationError
    Forbidden:
      description: |
        Two distinct cases share this status:
        - **Re-authenticate**: body has no `error` key (Frappe framework shape, `exc_type: PermissionError`).
          The caller is Guest because there is no session or the `sid` cookie is expired or invalid.
        - **Permission denied**: body is the `error` envelope with `code: permission_denied`; the user is
          logged in but the role lacks the right.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/FrappeFrameworkError"
          examples:
            permission_denied:
              value:
                error: { code: permission_denied, message: "Role Infra Viewer cannot run playbooks", details: { role: Infra Viewer, required: Infra Operator } }
            reauthenticate:
              value:
                exception: "frappe.exceptions.PermissionError: You are not permitted to access this resource."
                exc_type: PermissionError
                _server_messages: "[\"{\\\"message\\\": \\\"You are not permitted to access this resource.\\\", \\\"title\\\": \\\"Not Permitted\\\"}\"]"
    RateLimited:
      description: Too many requests; retry after the number of seconds in `Retry-After`
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: rate_limited, message: "Too many requests", details: { retry_after: 30 } }
    NotFound:
      description: Target does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: not_found, message: "Server SRV-9999 not found", details: { doctype: Server, name: SRV-9999 } }
    ValidationError:
      description: Invalid parameters or body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: validation_error, message: "params.apps must be an array", details: { field: params.apps } }
    ValidationOrConfirmation:
      description: |
        Invalid input, or a high-risk playbook without the right `confirm`: the target name for
        `jobs.run`, `"<playbook key>:<target count>"` for `bulk.create`. `details.expected` always
        carries the exact string to type.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            confirmation_required:
              value:
                error: { code: confirmation_required, message: "Type the server name to confirm", details: { expected: SRV-0001 } }
            bulk_confirmation_required:
              value:
                error: { code: confirmation_required, message: "Type the playbook key and target count to confirm", details: { expected: "site.restore:3" } }
            validation_error:
              value:
                error: { code: validation_error, message: "params.apps must be an array", details: { field: params.apps } }
    CapabilityMissing:
      description: The target's provider does not support the required capability
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: capability_missing, message: "Provider frappe_cloud lacks capability service_control", details: { capability: service_control, provider: frappe_cloud } }
    InvalidState:
      description: The entity is not in a state that allows this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: invalid_state, message: "Job JOB-00042 is already Success", details: { status: Success } }

  # ---------------------------------------------------------------------------
  schemas:
    # ----- errors -------------------------------------------------------------
    ErrorCode:
      type: string
      enum:
        - validation_error
        - permission_denied
        - not_found
        - confirmation_required
        - capability_missing
        - invalid_state
        - invalid_cursor
        - rate_limited
        - provider_error
        - internal_error
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          description: Machine-readable context; keys depend on `code`.
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    FrappeFrameworkError:
      type: object
      description: |
        Emitted by Frappe before the handler runs, so it never has the `error` envelope. Verified on
        Frappe v15.98 with a test client (integration test `test_auth_shape.py`):
        - `AuthenticationError` -> 401: invalid API token.
        - `PermissionError` -> 403: Guest calling a non-guest method, i.e. no session or an expired or
          invalid `sid` cookie (Frappe resets it to Guest; it does not answer 401).
        - `CSRFTokenError` -> 400: POST with a session whose CSRF token does not match
          `X-Frappe-CSRF-Token` (only enforced once a token exists for the session, which the `/infra`
          page guarantees).
        Clients detect "re-authenticate" as `status === 401 || (status === 403 && !("error" in body))`
        and "permission denied" as `status === 403 && body.error?.code === "permission_denied"`.
      additionalProperties: true
      required: [exc_type]
      properties:
        exc_type:
          type: string
          enum: [AuthenticationError, PermissionError, CSRFTokenError]
        exception: { type: string }
        _server_messages: { type: string, description: JSON-encoded list of JSON-encoded message objects (Frappe format) }

    # ----- enums (plan section 5) ----------------------------------------------
    Provider:
      type: string
      enum: [digitalocean, frappe_cloud]
    Capability:
      type: string
      enum: [site, bench, server, ssh, snapshot, service_control, metrics, custom_playbook, managed_backup, managed_update]
    ServerStatus:
      type: string
      enum: [Provisioning, Active, Degraded, Down, Archived]
    SiteStatus:
      type: string
      enum: [Pending, Active, Maintenance, Suspended, Broken, Archived]
    JobStatus:
      type: string
      enum: [Queued, Running, Success, Failed, Cancelled]
    StepStatus:
      type: string
      enum: [Queued, Running, Success, Failed, Cancelled, Skipped]
    BulkStatus:
      type: string
      enum: [Queued, Running, Paused, Halted, Success, Failed, Cancelled]
    BulkPhase:
      type: string
      enum: [backup, canary, batches, done]
    BulkTargetStatus:
      type: string
      enum: [Pending, Running, Success, Failed, Skipped]
    AlertStatus:
      type: string
      enum: [firing, acknowledged, resolved]
    Severity:
      type: string
      enum: [info, warning, critical]
    Risk:
      type: string
      enum: [low, medium, high]
    TargetDoctype:
      type: string
      enum: [Server, Site, Bench, Provider Account]
    AlertRuleKind:
      type: string
      description: |
        `metric`: threshold on a server metric (user-created). `heartbeat`: no server heartbeat for
        `for_minutes`. `ssl_expiry`: a site certificate expires within `threshold` days. `drift`:
        inventory sync found a difference. `contract`: the daily Press API contract test failed.
        Only `metric` rules can be created or deleted; the other kinds exist as built-in rules.
      enum: [metric, heartbeat, ssl_expiry, drift, contract]
    ServerRole:
      type: string
      enum: [app, db, proxy, all]
    MetricName:
      type: string
      enum: [cpu, ram, disk, load1, queue_backlog]
    Resolution:
      type: string
      enum: [1m, 1h, 1d]
    FailurePolicy:
      type: string
      enum: [halt, continue]
    Operator:
      type: string
      enum: [gt, gte, lt, lte, eq]
    AlertChannel:
      type: string
      enum: [telegram, email]
    BackupKind:
      type: string
      enum: [db, files, snapshot]
    AuditResult:
      type: string
      enum: [success, failed, denied]
    SearchResultType:
      type: string
      enum: [server, site, bench, playbook, job, alert]

    # ----- shared --------------------------------------------------------------
    TargetRef:
      type: object
      additionalProperties: false
      required: [target_doctype, target_name]
      properties:
        target_doctype: { $ref: "#/components/schemas/TargetDoctype" }
        target_name: { type: string }
    JobRef:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: { type: string }
    BulkRef:
      type: object
      additionalProperties: false
      required: [bulk]
      properties:
        bulk: { type: string }
    NextCursor:
      type: [string, "null"]
      description: Pass as `cursor` to fetch the next page; `null` when there is none.
    InstalledApp:
      type: object
      additionalProperties: false
      required: [app, version, branch]
      properties:
        app: { type: string }
        version: { type: [string, "null"] }
        branch: { type: [string, "null"] }

    # ----- inventory -----------------------------------------------------------
    Server:
      type: object
      # Extended via allOf (see *Detail); the derived schema closes it with unevaluatedProperties.
      required: [name, hostname, provider, provider_account, provider_ref, public_ip, private_ip, role, region, size, tags, status, last_heartbeat, capabilities, bench_count, site_count]
      properties:
        name: { type: string, description: "Stable id (naming series), e.g. `SRV-0001`" }
        hostname: { type: string, description: Display name (the droplet name); used as the topology label and the search title }
        provider: { $ref: "#/components/schemas/Provider" }
        provider_account: { type: string }
        provider_ref: { type: string, description: Droplet id }
        public_ip: { type: [string, "null"] }
        private_ip: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/ServerRole" }
        region: { type: string }
        size: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ServerStatus" }
        last_heartbeat: { type: [string, "null"], format: date-time }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" }, description: "Provider-level capability set (plan section 4.2); actions come from `playbooks.list`" }
        bench_count: { type: integer, minimum: 0 }
        site_count: { type: integer, minimum: 0 }
    ServerPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Server" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    MetricSnapshot:
      type: object
      additionalProperties: false
      required: [ts, cpu, ram, disk, load1, queue_backlog]
      properties:
        ts: { type: string, format: date-time }
        cpu: { type: number, minimum: 0, maximum: 100, description: percent }
        ram: { type: number, minimum: 0, maximum: 100, description: percent }
        disk: { type: number, minimum: 0, maximum: 100, description: percent }
        load1: { type: number, minimum: 0 }
        queue_backlog: { type: integer, minimum: 0 }
    ServerDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Server"
        - type: object
          required: [benches, latest_metrics, running_job]
          properties:
            benches: { type: array, items: { $ref: "#/components/schemas/Bench" } }
            latest_metrics:
              oneOf:
                - $ref: "#/components/schemas/MetricSnapshot"
                - type: "null"
            running_job: { type: [string, "null"], description: Name of the job currently holding this server's lock }
    Bench:
      type: object
      # Extended via allOf (see *Detail); the derived schema closes it with unevaluatedProperties.
      required: [name, title, provider, provider_account, provider_ref, server, path, frappe_version, apps, site_count, capabilities]
      properties:
        name: { type: string }
        title: { type: string, description: Display name (bench directory name or Press release group title) }
        provider: { $ref: "#/components/schemas/Provider" }
        provider_account: { type: string }
        provider_ref: { type: string }
        server: { type: [string, "null"], description: "`null` for Frappe Cloud benches" }
        path: { type: [string, "null"] }
        frappe_version: { type: [string, "null"] }
        apps: { type: array, items: { $ref: "#/components/schemas/InstalledApp" } }
        site_count: { type: integer, minimum: 0 }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" }, description: "Provider-level capability set (plan section 4.2); actions come from `playbooks.list`" }
    BenchPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Bench" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    BenchDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Bench"
        - type: object
          required: [sites, running_job]
          properties:
            sites: { type: array, items: { $ref: "#/components/schemas/Site" } }
            running_job: { type: [string, "null"], description: "Job currently holding the lock of this bench's server (`null` for Frappe Cloud)" }
    Site:
      type: object
      # Extended via allOf (see *Detail); the derived schema closes it with unevaluatedProperties.
      required: [name, domain, provider, provider_account, provider_ref, bench, server, status, plan, ssl_expiry, db_size_mb, last_backup, custom_domains, capabilities]
      properties:
        name: { type: string }
        domain: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        provider_account: { type: string }
        provider_ref: { type: string }
        bench: { type: string }
        server: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SiteStatus" }
        plan: { type: [string, "null"] }
        ssl_expiry: { type: [string, "null"], format: date-time }
        db_size_mb: { type: [number, "null"], minimum: 0 }
        last_backup: { type: [string, "null"], format: date-time }
        custom_domains: { type: array, items: { type: string } }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" }, description: "Provider-level capability set (plan section 4.2); actions come from `playbooks.list`" }
    SitePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Site" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    Backup:
      type: object
      additionalProperties: false
      required: [name, site, kind, location, size_mb, created_at, last_restore_test, restore_test_ok]
      properties:
        name: { type: string }
        site: { type: string }
        kind: { $ref: "#/components/schemas/BackupKind" }
        location: { type: string, description: "Storage path or provider reference, never a signed URL" }
        size_mb: { type: number, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_restore_test: { type: [string, "null"], format: date-time }
        restore_test_ok: { type: [boolean, "null"] }
    SiteDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Site"
        - type: object
          required: [bench_info, backups, running_job]
          properties:
            bench_info: { $ref: "#/components/schemas/Bench" }
            backups: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Backup" }, description: Most recent first }
            running_job: { type: [string, "null"] }

    # ----- topology / overview -------------------------------------------------
    TopologyNodeType:
      type: string
      enum: [provider, server, bench, site]
    TopologyNode:
      type: object
      additionalProperties: false
      required: [id, type, ref, label, status, provider, has_running_job]
      properties:
        id: { type: string, description: "`<type>:<ref>`, unique in the graph" }
        type: { $ref: "#/components/schemas/TopologyNodeType" }
        ref: { type: string, description: "Document name (Provider Account, Server, Bench or Site)" }
        label: { type: string, description: "Display name: Server.hostname, Bench.title, Site.domain, Provider Account label" }
        status: { type: [string, "null"], description: "Unified status for servers and sites; `null` for providers and benches" }
        provider: { $ref: "#/components/schemas/Provider" }
        has_running_job: { type: boolean }
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [id, source, target]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
    Topology:
      type: object
      additionalProperties: false
      required: [nodes, edges, generated_at]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/TopologyNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/TopologyEdge" } }
        generated_at: { type: string, format: date-time }
    ServerStatusCounts:
      type: object
      additionalProperties: false
      required: [Provisioning, Active, Degraded, Down, Archived]
      properties:
        Provisioning: { type: integer, minimum: 0 }
        Active: { type: integer, minimum: 0 }
        Degraded: { type: integer, minimum: 0 }
        Down: { type: integer, minimum: 0 }
        Archived: { type: integer, minimum: 0 }
    SiteStatusCounts:
      type: object
      additionalProperties: false
      required: [Pending, Active, Maintenance, Suspended, Broken, Archived]
      properties:
        Pending: { type: integer, minimum: 0 }
        Active: { type: integer, minimum: 0 }
        Maintenance: { type: integer, minimum: 0 }
        Suspended: { type: integer, minimum: 0 }
        Broken: { type: integer, minimum: 0 }
        Archived: { type: integer, minimum: 0 }
    OverviewSummary:
      type: object
      additionalProperties: false
      required: [servers, sites, jobs, alerts, running_jobs, recent_alerts, generated_at]
      properties:
        servers:
          type: object
          additionalProperties: false
          required: [total, by_status]
          properties:
            total: { type: integer, minimum: 0 }
            by_status: { $ref: "#/components/schemas/ServerStatusCounts" }
        sites:
          type: object
          additionalProperties: false
          required: [total, by_status]
          properties:
            total: { type: integer, minimum: 0 }
            by_status: { $ref: "#/components/schemas/SiteStatusCounts" }
        jobs:
          type: object
          additionalProperties: false
          required: [queued, running, success_24h, failed_24h]
          properties:
            queued: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            success_24h: { type: integer, minimum: 0 }
            failed_24h: { type: integer, minimum: 0 }
        alerts:
          type: object
          additionalProperties: false
          required: [unresolved, info, warning, critical]
          properties:
            unresolved: { type: integer, minimum: 0, description: All unresolved alerts (firing + acknowledged) }
            info: { type: integer, minimum: 0 }
            warning: { type: integer, minimum: 0 }
            critical: { type: integer, minimum: 0 }
        running_jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        recent_alerts: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Alert" } }
        generated_at: { type: string, format: date-time }

    # ----- metrics -------------------------------------------------------------
    MetricPoint:
      type: object
      additionalProperties: false
      required: [ts, value]
      properties:
        ts: { type: string, format: date-time }
        value: { type: [number, "null"], description: "`null` marks a gap (no reading)" }
    MetricSeries:
      type: object
      additionalProperties: false
      required: [server, metric, resolution, from, to, points]
      properties:
        server: { type: string }
        metric: { $ref: "#/components/schemas/MetricName" }
        resolution: { $ref: "#/components/schemas/Resolution" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        points: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/MetricPoint" } }

    # ----- playbooks -----------------------------------------------------------
    Playbook:
      type: object
      additionalProperties: false
      required: [key, title, description, target_doctype, creates, risk, required_capability, params_schema]
      properties:
        key: { type: string, description: "e.g. `site.migrate`" }
        title: { type: string }
        description: { type: string }
        target_doctype: { $ref: "#/components/schemas/TargetDoctype", description: "The existing document a job targets. Creation playbooks target the parent (`Provider Account` for `server.provision`, `Bench` for `site.create`)." }
        creates:
          oneOf:
            - $ref: "#/components/schemas/TargetDoctype"
            - type: "null"
          description: Doctype of the document the job creates (`Server`, `Site`), else `null`. The UI renders a "create" form from `params_schema` when set.
        risk: { $ref: "#/components/schemas/Risk" }
        required_capability:
          oneOf:
            - $ref: "#/components/schemas/Capability"
            - type: "null"
        params_schema:
          type: object
          description: JSON Schema (draft 2020-12) for `params`. The UI renders the form from it.
          additionalProperties: true
    PlaybookList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Playbook" } }

    # ----- jobs ----------------------------------------------------------------
    Job:
      type: object
      # Extended via allOf (see *Detail); the derived schema closes it with unevaluatedProperties.
      required: [name, playbook, playbook_title, target_doctype, target_name, params, status, progress, steps_done, steps_total, triggered_by, bulk_operation, retry_of, created, cancel_requested, created_at, started_at, ended_at, error]
      properties:
        name: { type: string }
        playbook: { type: string }
        playbook_title: { type: string }
        target_doctype: { $ref: "#/components/schemas/TargetDoctype" }
        target_name: { type: string }
        params: { type: object, additionalProperties: true, description: Masked; secrets never appear }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        steps_done: { type: integer, minimum: 0 }
        steps_total: { type: integer, minimum: 0, description: 0 while unknown }
        triggered_by: { type: string, description: "User id, or `scheduler`" }
        bulk_operation: { type: [string, "null"] }
        retry_of: { type: [string, "null"] }
        created:
          oneOf:
            - $ref: "#/components/schemas/TargetRef"
            - type: "null"
          description: The document a creation playbook produced (`server.provision` -> Server, `site.create` -> Site). `null` until the job succeeds and for all other playbooks.
        cancel_requested: { type: boolean, description: "`jobs.cancel` was called; the status flips to `Cancelled` when the worker observes it" }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"], description: Short masked failure reason }
    JobStep:
      type: object
      additionalProperties: false
      required: [idx, title, status, output, started_at, ended_at]
      properties:
        idx: { type: integer, minimum: 0 }
        title: { type: string }
        status: { $ref: "#/components/schemas/StepStatus" }
        output: { type: string, description: "Masked, may be truncated to the last 64 KB" }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    JobDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
    JobPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    JobEnvelope:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }
    JobRunRequest:
      type: object
      additionalProperties: false
      required: [playbook, target_doctype, target_name]
      properties:
        playbook: { type: string }
        target_doctype: { $ref: "#/components/schemas/TargetDoctype" }
        target_name: { type: string }
        params: { type: object, additionalProperties: true, default: {} }
        confirm: { type: string, description: "Must equal `target_name` for high-risk playbooks" }

    # ----- bulk ----------------------------------------------------------------
    BulkOperation:
      type: object
      # Extended via allOf (see *Detail); the derived schema closes it with unevaluatedProperties.
      required: [name, playbook, playbook_title, status, phase, failure_policy, batch_size, canary_target, total, done, failed, current_batch, batches_total, triggered_by, created_at, started_at, ended_at]
      properties:
        name: { type: string }
        playbook: { type: string }
        playbook_title: { type: string }
        status: { $ref: "#/components/schemas/BulkStatus" }
        phase: { $ref: "#/components/schemas/BulkPhase" }
        failure_policy: { $ref: "#/components/schemas/FailurePolicy" }
        batch_size: { type: integer, minimum: 1 }
        canary_target: { $ref: "#/components/schemas/TargetRef" }
        total: { type: integer, minimum: 0, description: Number of targets including the canary }
        done: { type: integer, minimum: 0, description: Targets in a terminal state }
        failed: { type: integer, minimum: 0 }
        current_batch: { type: integer, minimum: 0, description: 0 = canary }
        batches_total: { type: integer, minimum: 0 }
        triggered_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    BulkTarget:
      type: object
      additionalProperties: false
      required: [target_doctype, target_name, status, job, batch]
      properties:
        target_doctype: { $ref: "#/components/schemas/TargetDoctype" }
        target_name: { type: string }
        status: { $ref: "#/components/schemas/BulkTargetStatus" }
        job: { type: [string, "null"] }
        batch: { type: integer, minimum: 0, description: 0 = canary }
    BulkOperationDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/BulkOperation"
        - type: object
          required: [targets]
          properties:
            targets: { type: array, items: { $ref: "#/components/schemas/BulkTarget" } }
    BulkEnvelope:
      type: object
      additionalProperties: false
      required: [bulk]
      properties:
        bulk: { $ref: "#/components/schemas/BulkOperation" }
    BulkPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BulkOperation" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    BulkCreateRequest:
      type: object
      additionalProperties: false
      required: [playbook, targets, canary_target]
      properties:
        playbook: { type: string }
        targets: { type: array, minItems: 1, items: { $ref: "#/components/schemas/TargetRef" } }
        canary_target: { $ref: "#/components/schemas/TargetRef", description: "Must be one of `targets`" }
        batch_size: { type: integer, minimum: 1, maximum: 50, default: 5 }
        failure_policy: { $ref: "#/components/schemas/FailurePolicy", default: halt }
        params: { type: object, additionalProperties: true, default: {} }
        confirm: { type: string, description: "For high-risk playbooks: must equal `\"<playbook key>:<number of targets>\"`, e.g. `site.restore:3`" }

    # ----- alerts --------------------------------------------------------------
    Alert:
      type: object
      additionalProperties: false
      required: [name, rule, rule_title, kind, severity, status, target, metric, value, message, fired_at, acknowledged_by, acknowledged_at, resolved_at]
      properties:
        name: { type: string }
        rule: { type: string }
        rule_title: { type: string }
        kind: { $ref: "#/components/schemas/AlertRuleKind" }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/AlertStatus" }
        target: { $ref: "#/components/schemas/TargetRef" }
        metric: { type: [string, "null"], description: "Metric name, or `null` for non-metric alerts (heartbeat, drift, contract)" }
        value: { type: [number, "null"] }
        message: { type: string }
        fired_at: { type: string, format: date-time }
        acknowledged_by: { type: [string, "null"] }
        acknowledged_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    AlertPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    AlertEnvelope:
      type: object
      additionalProperties: false
      required: [alert]
      properties:
        alert: { $ref: "#/components/schemas/Alert" }
    AlertRuleInput:
      type: object
      description: Body of `alert_rules.create`. Only `metric` rules can be created; the built-in kinds exist from install.
      additionalProperties: false
      required: [title, metric, operator, threshold, for_minutes, severity, channels]
      properties:
        title: { type: string, minLength: 1 }
        kind: { type: string, const: metric, default: metric }
        target_doctype: { type: string, const: Server, default: Server }
        metric: { $ref: "#/components/schemas/MetricName" }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        for_minutes: { type: integer, minimum: 0, maximum: 1440 }
        severity: { $ref: "#/components/schemas/Severity" }
        channels: { type: array, items: { $ref: "#/components/schemas/AlertChannel" }, uniqueItems: true }
        enabled: { type: boolean, default: true }
    AlertRule:
      type: object
      description: |
        Field usage per `kind` (enforced by the `allOf` conditions below):

        | kind | target_doctype | metric | operator | threshold | for_minutes | builtin |
        |---|---|---|---|---|---|---|
        | metric | Server | required | required | required | required (0 = immediate) | false |
        | heartbeat | Server | null | null | null | minutes without heartbeat | true |
        | ssl_expiry | Site | null | null | days before expiry | null | true |
        | drift | Provider Account | null | null | null | null | true |
        | contract | Provider Account | null | null | null | null | true |

        Editable through `alert_rules.update`: `title`, `severity`, `channels`, `enabled` for every
        kind; `metric`, `operator`, `threshold`, `for_minutes` for `metric`; `for_minutes` for
        `heartbeat`; `threshold` for `ssl_expiry`. Anything else -> `400 validation_error`.
        Built-in rules cannot be created or deleted (`409 invalid_state`).
      additionalProperties: false
      required: [name, title, kind, target_doctype, metric, operator, threshold, for_minutes, severity, channels, enabled, builtin, modified_at]
      properties:
        name: { type: string }
        title: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/AlertRuleKind" }
        target_doctype:
          type: string
          enum: [Server, Site, Provider Account]
        metric:
          oneOf:
            - $ref: "#/components/schemas/MetricName"
            - type: "null"
        operator:
          oneOf:
            - $ref: "#/components/schemas/Operator"
            - type: "null"
        threshold: { type: [number, "null"] }
        for_minutes: { type: [integer, "null"], minimum: 0, maximum: 1440 }
        severity: { $ref: "#/components/schemas/Severity" }
        channels: { type: array, items: { $ref: "#/components/schemas/AlertChannel" }, uniqueItems: true }
        enabled: { type: boolean }
        builtin: { type: boolean, description: Created on install; cannot be deleted }
        modified_at: { type: string, format: date-time }
      allOf:
        - if: { properties: { kind: { const: metric } } }
          then:
            properties:
              target_doctype: { const: Server }
              metric: { type: string }
              operator: { type: string }
              threshold: { type: number }
              for_minutes: { type: integer }
              builtin: { const: false }
        - if: { properties: { kind: { const: heartbeat } } }
          then:
            properties:
              target_doctype: { const: Server }
              metric: { type: "null" }
              operator: { type: "null" }
              threshold: { type: "null" }
              for_minutes: { type: integer, minimum: 1 }
              builtin: { const: true }
        - if: { properties: { kind: { const: ssl_expiry } } }
          then:
            properties:
              target_doctype: { const: Site }
              metric: { type: "null" }
              operator: { type: "null" }
              threshold: { type: number, minimum: 1 }
              for_minutes: { type: "null" }
              builtin: { const: true }
        - if: { properties: { kind: { enum: [drift, contract] } } }
          then:
            properties:
              target_doctype: { const: Provider Account }
              metric: { type: "null" }
              operator: { type: "null" }
              threshold: { type: "null" }
              for_minutes: { type: "null" }
              builtin: { const: true }
    AlertRuleUpdate:
      type: object
      description: Omitted fields keep their value. Fields that do not apply to the rule's `kind` (see `AlertRule`) are rejected with `400 validation_error`.
      additionalProperties: false
      required: [rule]
      properties:
        rule: { type: string }
        title: { type: string, minLength: 1 }
        metric: { $ref: "#/components/schemas/MetricName" }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        for_minutes: { type: integer, minimum: 0, maximum: 1440 }
        severity: { $ref: "#/components/schemas/Severity" }
        channels: { type: array, items: { $ref: "#/components/schemas/AlertChannel" }, uniqueItems: true }
        enabled: { type: boolean }
    AlertRulePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    AlertRuleEnvelope:
      type: object
      additionalProperties: false
      required: [rule]
      properties:
        rule: { $ref: "#/components/schemas/AlertRule" }

    # ----- git (ADR 0005) ------------------------------------------------------
    GitConnection:
      type: object
      additionalProperties: false
      required: [name, label, provider, enabled, login, account_type, scopes, verified_at]
      properties:
        name: { type: string }
        label: { type: string }
        provider: { type: string, enum: [github] }
        enabled: { type: boolean }
        login: { type: [string, "null"] }
        account_type: { type: [string, "null"], description: "User or Organization" }
        scopes: { type: array, items: { type: string } }
        verified_at: { type: [string, "null"], format: date-time }
    GitConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitConnection" } }
    GitRepo:
      type: object
      additionalProperties: false
      required: [full_name, name, owner, private, default_branch, clone_url, description, pushed_at]
      properties:
        full_name: { type: string }
        name: { type: string }
        owner: { type: string }
        private: { type: boolean }
        default_branch: { type: string }
        clone_url: { type: string, format: uri }
        description: { type: [string, "null"] }
        pushed_at: { type: [string, "null"], format: date-time }
    GitRepoPage:
      type: object
      additionalProperties: false
      required: [items, next_page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitRepo" } }
        next_page: { type: [integer, "null"] }
    GitRef:
      type: object
      additionalProperties: false
      required: [name, kind, sha]
      properties:
        name: { type: string }
        kind: { type: string, enum: [branch, tag] }
        sha: { type: string }
    GitRefList:
      type: object
      additionalProperties: false
      required: [repo, items]
      properties:
        repo: { $ref: "#/components/schemas/GitRepo" }
        items: { type: array, items: { $ref: "#/components/schemas/GitRef" } }

    # ----- providers (ADR 0006) ------------------------------------------------
    ProviderAccountSummary:
      type: object
      additionalProperties: false
      required: [name, label, provider, enabled, is_staging]
      properties:
        name: { type: string }
        label: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        enabled: { type: boolean }
        is_staging: { type: boolean }
    ProviderAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProviderAccountSummary" } }
    ProvisionRegion:
      type: object
      additionalProperties: false
      required: [slug, name, sizes]
      properties:
        slug: { type: string }
        name: { type: string }
        sizes: { type: array, items: { type: string }, description: "Size slugs offered in the region" }
    ProvisionSize:
      type: object
      additionalProperties: false
      required: [slug, family, description, vcpus, memory_mb, disk_gb, transfer_tb, price_monthly, price_hourly, regions]
      properties:
        slug: { type: string }
        family: { type: string, enum: [basic, general, cpu, memory, storage, other] }
        description: { type: string }
        vcpus: { type: integer }
        memory_mb: { type: integer }
        disk_gb: { type: integer }
        transfer_tb: { type: number }
        price_monthly: { type: number, description: "USD" }
        price_hourly: { type: number, description: "USD" }
        regions: { type: array, items: { type: string } }
    ProvisionCatalogue:
      type: object
      additionalProperties: false
      required: [account, provider, regions, sizes, defaults]
      properties:
        account: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        regions: { type: array, items: { $ref: "#/components/schemas/ProvisionRegion" } }
        sizes: { type: array, items: { $ref: "#/components/schemas/ProvisionSize" } }
        defaults:
          type: object
          additionalProperties: false
          required: [region, size, image]
          properties:
            region: { type: string }
            size: { type: string }
            image: { type: string }

    # ----- console (ADR 0007) --------------------------------------------------
    ConsoleTicket:
      type: object
      additionalProperties: false
      required: [ticket, path, expires_in, session, server, hostname, user, certificate_valid_for]
      properties:
        ticket: { type: string, description: "Single use; 60 s" }
        path: { type: string, description: "WebSocket path on the app origin, e.g. /console/ws" }
        expires_in: { type: integer }
        session: { type: string, description: "Id of the session's transcript" }
        server: { type: string }
        hostname: { type: string }
        user: { type: string, description: "SSH user on the server" }
        certificate_valid_for: { type: string, description: "ssh-keygen validity, e.g. +10m" }
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [session, server, hostname, by, started_at, ended_at, bytes, status, reason]
      properties:
        session: { type: string }
        server: { type: string }
        hostname: { type: string }
        by: { type: string, description: "Operator who opened it" }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        bytes: { type: integer }
        status: { type: string, enum: [open, closed] }
        reason: { type: [string, "null"], description: "client closed | ssh exited | idle timeout | maximum session length" }
    ConsoleSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ConsoleSession" } }
    ConsoleTranscript:
      type: object
      additionalProperties: false
      required: [session, server, hostname, by, started_at, ended_at, bytes, status, reason, transcript, truncated]
      properties:
        session: { type: string }
        server: { type: string }
        hostname: { type: string }
        by: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        bytes: { type: integer }
        status: { type: string, enum: [open, closed] }
        reason: { type: [string, "null"] }
        transcript: { type: string, description: "Raw terminal bytes as UTF-8 (last 200 KB)" }
        truncated: { type: boolean }

    # ----- backups (A4.2) ------------------------------------------------------
    BackupFrequency:
      type: string
      enum: [hourly, daily, weekly]
    BackupPolicy:
      type: object
      additionalProperties: false
      required: [site, enabled, frequency, hour, weekday, with_files, retain, last_run, last_job, next_run]
      properties:
        site: { type: string }
        enabled: { type: boolean }
        frequency: { $ref: "#/components/schemas/BackupFrequency" }
        hour: { type: integer, minimum: 0, maximum: 23, description: "System-timezone hour for daily/weekly" }
        weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        with_files: { type: boolean }
        retain: { type: integer, minimum: 0, maximum: 365, description: "Backups kept per kind; 0 keeps everything" }
        last_run: { type: [string, "null"], format: date-time }
        last_job: { type: [string, "null"] }
        next_run: { type: [string, "null"], format: date-time }
    BackupPolicyInput:
      type: object
      additionalProperties: false
      required: [site]
      properties:
        site: { type: string }
        enabled: { type: boolean, default: true }
        frequency: { $ref: "#/components/schemas/BackupFrequency" }
        hour: { type: integer, minimum: 0, maximum: 23, default: 2 }
        weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun], default: sun }
        with_files: { type: boolean, default: true }
        retain: { type: integer, minimum: 0, maximum: 365, default: 14 }
    BackupPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ----- tenants -------------------------------------------------------------
    TenantStatus:
      type: string
      enum: [active, suspended]
    Tenant:
      type: object
      additionalProperties: false
      required: [name, label, title, status, plan, contact_email, contact_phone, notes, site_count, modified_at]
      properties:
        name: { type: string }
        label: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TenantStatus" }
        plan: { type: [string, "null"] }
        contact_email: { type: [string, "null"] }
        contact_phone: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        site_count: { type: integer }
        modified_at: { type: [string, "null"], format: date-time }
    TenantSite:
      type: object
      additionalProperties: false
      required: [name, domain, status, server, bench]
      properties:
        name: { type: string }
        domain: { type: string }
        status: { $ref: "#/components/schemas/SiteStatus" }
        server: { type: [string, "null"] }
        bench: { type: [string, "null"] }
    TenantDetail:
      type: object
      additionalProperties: false
      required: [name, label, title, status, plan, contact_email, contact_phone, notes, site_count, modified_at, sites]
      properties:
        name: { type: string }
        label: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TenantStatus" }
        plan: { type: [string, "null"] }
        contact_email: { type: [string, "null"] }
        contact_phone: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        site_count: { type: integer }
        modified_at: { type: [string, "null"], format: date-time }
        sites: { type: array, items: { $ref: "#/components/schemas/TenantSite" } }
    TenantEnvelope:
      type: object
      additionalProperties: false
      required: [tenant]
      properties:
        tenant: { $ref: "#/components/schemas/TenantDetail" }
    TenantPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ----- security (A4.1) -----------------------------------------------------
    SecurityCheck:
      type: object
      additionalProperties: false
      required: [id, title, status, detail, hint]
      properties:
