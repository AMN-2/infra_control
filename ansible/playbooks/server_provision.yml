---
# server.provision, configure stage (plan 9.2): run after the droplet is active and the managed
# firewall is attached. Roles follow the server's role (inventory var `server_role`):
#   all   -> base, mariadb, redis, nginx, bench
#   app   -> base, redis, nginx, bench
#   db    -> base, mariadb
#   proxy -> base, nginx
- name: Wait for the new server
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until SSH answers
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 5
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
      timeout: 900

- name: Configure server
  hosts: all
  become: true
  vars:
    role_map:
      all: [base, mariadb, redis, nginx, bench]
      app: [base, redis, nginx, bench]
      db: [base, mariadb]
      proxy: [base, nginx]
  tasks:
    - name: Apply roles for this server
      ansible.builtin.include_role:
        name: "{{ role_item }}"
      loop: "{{ role_map[server_role | default('all')] }}"
      loop_control:
        loop_var: role_item

# Verification (ADR 0006): a provision that leaves any of this unmet fails the job instead of
# reporting a half-built server.
- name: Verify server
  hosts: all
  become: true
  gather_facts: false
  vars:
    service_map:
      base: []
      mariadb: [mariadb.service]
      redis: [redis-server.service]
      nginx: [nginx.service]
      bench: [supervisor.service]
    role_map:
      all: [base, mariadb, redis, nginx, bench]
      app: [base, redis, nginx, bench]
      db: [base, mariadb]
      proxy: [base, nginx]
  tasks:
    - name: Collect service states
      ansible.builtin.service_facts:

    - name: Required services are running
      ansible.builtin.assert:
        that: ansible_facts.services[item].state == 'running'
        fail_msg: "{{ item }} is not running"
        quiet: true
      loop: "{{ role_map[server_role | default('all')] | map('extract', service_map) | flatten }}"

    - name: Node is {{ bench_node_major | default(20) }} or newer
      ansible.builtin.command: node --version
      register: verify_node
      changed_when: false
      failed_when: (verify_node.stdout | regex_replace('^v', '') | split('.') | first | int) < (bench_node_major | default(20) | int)
      when: "'bench' in role_map[server_role | default('all')]"

    - name: bench CLI answers for the frappe user
      become_user: frappe
      ansible.builtin.command: /home/frappe/.local/bin/bench --version
      changed_when: false
      when: "'bench' in role_map[server_role | default('all')]"

    - name: The bench lists frappe
      become_user: frappe
      ansible.builtin.command:
        argv: [/home/frappe/.local/bin/bench, version]
        chdir: "/home/frappe/{{ bench_name | default('frappe-bench') }}"
      register: verify_bench
      changed_when: false
      failed_when: "'frappe' not in verify_bench.stdout"
      when: "'bench' in role_map[server_role | default('all')] and (bench_init | default(false) | bool)"

    - name: Report
      ansible.builtin.debug:
        msg: "verified: services up, node {{ verify_node.stdout | default('n/a') }}, bench ready"
