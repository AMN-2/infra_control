---
- name: Install bench prerequisites
  ansible.builtin.apt:
    name: "{{ bench_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install yarn globally
  ansible.builtin.command: npm install -g yarn
  args:
    creates: /usr/local/bin/yarn

- name: Supervisor is enabled and running
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: true

- name: Install the bench CLI for the frappe user
  become: true
  become_user: "{{ bench_user }}"
  ansible.builtin.command: "pipx install frappe-bench=={{ bench_cli_version }}"
  args:
    creates: "{{ bench_home }}/.local/bin/bench"
  environment:
    PATH: "{{ bench_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

- name: Put pipx binaries on the frappe user's PATH
  ansible.builtin.lineinfile:
    path: "{{ bench_home }}/.profile"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: true
    owner: "{{ bench_user }}"
    group: "{{ bench_user }}"
    mode: "0644"

- name: Initialise a bench
  when: bench_init | bool
  become: true
  become_user: "{{ bench_user }}"
  ansible.builtin.command:
    cmd: >-
      {{ bench_home }}/.local/bin/bench init {{ bench_name }}
      --frappe-branch {{ bench_frappe_branch }} --python {{ bench_python }}
    chdir: "{{ bench_home }}"
    creates: "{{ bench_home }}/{{ bench_name }}/apps/frappe"
  environment:
    PATH: "{{ bench_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Production wiring done piece by piece. `bench setup production` was tried in the live gate and
# fails: it pip-installs Ansible into bench's own venv and then cannot find it for its fail2ban
# role. SSH is already restricted to the controller by the managed firewall.
- name: Generate the bench supervisor config
  when: bench_init | bool
  become: true
  become_user: "{{ bench_user }}"
  ansible.builtin.command:
    cmd: "{{ bench_home }}/.local/bin/bench setup supervisor --yes --user {{ bench_user }}"
    chdir: "{{ bench_home }}/{{ bench_name }}"
    creates: "{{ bench_home }}/{{ bench_name }}/config/supervisor.conf"
  environment:
    PATH: "{{ bench_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

- name: Enable the bench in supervisor
  when: bench_init | bool
  ansible.builtin.file:
    src: "{{ bench_home }}/{{ bench_name }}/config/supervisor.conf"
    dest: "/etc/supervisor/conf.d/{{ bench_name }}.conf"
    state: link
  register: bench_supervisor_link

- name: Load the bench processes
  when: bench_init | bool and bench_supervisor_link is changed
  ansible.builtin.command: supervisorctl update
  changed_when: true

- name: Generate the bench nginx config
  when: bench_init | bool
  become: true
  become_user: "{{ bench_user }}"
  ansible.builtin.command:
    cmd: "{{ bench_home }}/.local/bin/bench setup nginx --yes"
    chdir: "{{ bench_home }}/{{ bench_name }}"
    creates: "{{ bench_home }}/{{ bench_name }}/config/nginx.conf"
  environment:
    PATH: "{{ bench_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

- name: Enable the bench in nginx
  when: bench_init | bool
  ansible.builtin.file:
    src: "{{ bench_home }}/{{ bench_name }}/config/nginx.conf"
    dest: "/etc/nginx/conf.d/{{ bench_name }}.conf"
    state: link
  register: bench_nginx_link

- name: nginx can read the bench
  when: bench_init | bool
  ansible.builtin.file:
    path: "{{ bench_home }}"
    mode: "0755"

- name: Validate nginx with the bench config
  when: bench_init | bool and bench_nginx_link is changed
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Reload nginx for the bench
  when: bench_init | bool and bench_nginx_link is changed
  ansible.builtin.service:
    name: nginx
    state: reloaded
