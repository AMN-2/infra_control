---
# site.delete (A4.x safe deletion): a last database + files backup uploaded offsite first (the
# job fails here if that fails), then `bench drop-site --force --no-backup`, then nginx is
# regenerated so the vhost disappears. The Site document is archived by the controller on
# success; it is never deleted, so history and backups stay findable.
- name: Delete site
  hosts: all
  become: true
  become_user: frappe
  gather_facts: false
  environment:
    PATH: "/home/frappe/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Preflight
      ansible.builtin.include_tasks: tasks/site_preflight.yml

    - name: Last backup before deleting
      ansible.builtin.include_tasks: tasks/backup_upload.yml

    - name: Read the database admin credentials
      ansible.builtin.command: "awk -F= '/^(user|password)=/{print $2}' {{ db_admin_cnf }}"
      register: db_admin
      changed_when: false
      no_log: true

    - name: bench drop-site
      ansible.builtin.command:
        argv:
          - bench
          - drop-site
          - "{{ site }}"
          - --db-root-username
          - "{{ db_admin.stdout_lines[0] }}"
          - --db-root-password
          - "{{ db_admin.stdout_lines[1] }}"
          - --force
          - --no-backup
        chdir: "{{ bench_path }}"
        removes: "{{ bench_path }}/sites/{{ site }}/site_config.json"
      no_log: true

    - name: The site directory is gone
      ansible.builtin.stat:
        path: "{{ bench_path }}/sites/{{ site }}"
      register: site_dir
      failed_when: site_dir.stat.exists

    - name: Regenerate the nginx config
      ansible.builtin.command:
        argv: [bench, setup, nginx, --yes]
        chdir: "{{ bench_path }}"
      changed_when: true

    - name: Validate nginx
      become_user: root
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      become_user: root
      ansible.builtin.service:
        name: nginx
        state: reloaded
