openapi: 3.1.0
info:
  title: Infra Control API
  version: 1.0.0
  summary: REST contract between the Infra Control backend (Agent A) and the Vue SPA (Agent B).
  description: |
    Binding contract from `ORCHESTRATOR_IMPLEMENTATION_PLAN.md` section 6.1. A change to this file
    requires a PR touching only `contracts/`, approved by the human reviewer and merged before either
    agent implements it.

    ## Conventions
    - Base path: `/api/method/infra_control.api.<module>.<fn>` (Frappe whitelisted methods).
    - `GET` endpoints take query parameters. `POST` endpoints take a JSON body.
    - Success bodies are the payload at the top level (no `message` wrapper).
    - Errors are `{ "error": { "code", "message", "details" } }` with a meaningful HTTP status.
      Only framework-level failures before the handler runs (no session, CSRF) keep Frappe's native
      shape; they are documented as `FrappeFrameworkError`.
    - Lists are cursor-paginated: `?limit=50&cursor=...` -> `{ "items": [...], "next_cursor": string | null }`.
      `cursor` is opaque; clients must not parse it.
    - Timestamps are RFC 3339 strings in UTC (`2026-10-07T09:30:00Z`).
    - Every `name` is the Frappe document name (stable id). Status strings are the unified enums of
      plan section 5; provider-specific strings never reach this API.
    - Capabilities are **provider-level**: `capabilities` on a Server, Bench or Site is the capability
      set of its provider account (plan section 4.2), not a per-entity feature list. The actions
      available for a target come from `playbooks.list?target_doctype=&target_name=`, which already
      applies the capability filter, the target's current status and the caller's role. Clients render
      actions from that list; they must not derive them from `capabilities` alone. Calling an action
      whose capability is absent yields `409 capability_missing`.
    - Creation flows: a job always targets an existing document. `server.provision` targets the
      `Provider Account` and `site.create` targets the `Bench` the new entity will live in; the new
      entity's fields go in `params` (see each playbook's `params_schema`). When the job succeeds,
      `Job.created` links to the new document (`null` until then, and for every other playbook).
    - High-risk playbooks require `confirm` to equal the target name, else `400 confirmation_required`.
      For a bulk operation `confirm` is `"<playbook key>:<number of targets>"` (e.g. `site.restore:3`).
    - Rate limiting: any endpoint may answer `429 rate_limited` with a `Retry-After` header (seconds).
    - Authentication failures (verified against Frappe v15, see `FrappeFrameworkError`):
      - `401` with `exc_type: AuthenticationError`: invalid `Authorization: token`.
      - `403` **without** an `error` key (`exc_type: PermissionError`): no session, or an expired or
        invalid `sid` cookie (Frappe silently downgrades it to Guest). Re-authenticate.
      - `403` **with** `error.code == permission_denied`: authenticated, but the role lacks the right.
      - `400` with `exc_type: CSRFTokenError`: session is fine, the CSRF token is stale; reload boot
        data to get a new token and retry once.
      Client rule: `reauthenticate = status === 401 || (status === 403 && !("error" in body))`.
    - Realtime events are delivered over Frappe Socket.IO (namespace `/<site>`, path `/socket.io`);
      payload schemas live in `contracts/events/`.
  contact:
    name: Agent A (Platform)
  license:
    name: MIT

servers:
  - url: /
    description: Same origin as the Frappe site that serves the SPA.

security:
  - sessionCookie: []
  - apiToken: []

tags:
  - name: overview
  - name: inventory
  - name: servers
  - name: benches
  - name: sites
  - name: metrics
  - name: playbooks
  - name: jobs
  - name: bulk
  - name: alerts
  - name: alert_rules
  - name: audit
  - name: search
  - name: git
  - name: providers
  - name: console
  - name: backups
  - name: tenants
  - name: security
  - name: session

x-realtime-events:
  - infra:job.updated
  - infra:job.step
  - infra:job.log
  - infra:bulk.updated
  - infra:server.heartbeat
  - infra:alert.fired
  - infra:alert.resolved
  - infra:inventory.changed

paths:
  # ---------------------------------------------------------------------------
  # overview
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.overview.summary:
    get:
      tags: [overview]
      operationId: overview_summary
      summary: Counts by status, running jobs, firing alerts
      responses:
        "200":
          description: Overview summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewSummary" }
              examples:
                default: { $ref: "#/components/examples/OverviewSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------------------
  # inventory
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.inventory.topology:
    get:
      tags: [inventory]
      operationId: inventory_topology
      summary: Nodes and edges for providers, servers, benches and sites
      responses:
        "200":
          description: Topology graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topology" }
              examples:
                default: { $ref: "#/components/examples/Topology" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------------------
  # servers
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.servers.list:
    get:
      tags: [servers]
      operationId: servers_list
      summary: List servers
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ServerStatus" }
        - name: provider_account
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/ServerRole" }
        - name: region
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Page of servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerPage" }
              examples:
                default: { $ref: "#/components/examples/ServerPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/method/infra_control.api.servers.get:
    get:
      tags: [servers]
      operationId: servers_get
      summary: Server detail with capabilities, benches and latest metrics
      parameters:
        - name: server
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDetail" }
              examples:
                default: { $ref: "#/components/examples/ServerDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # sites
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.sites.list:
    get:
      tags: [sites]
      operationId: sites_list
      summary: List sites
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SiteStatus" }
        - name: provider_account
          in: query
          schema: { type: string }
        - name: bench
          in: query
          schema: { type: string }
        - name: server
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Page of sites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
              examples:
                default: { $ref: "#/components/examples/SitePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/method/infra_control.api.sites.get:
    get:
      tags: [sites]
      operationId: sites_get
      summary: Site detail with capabilities, bench and recent backups
      parameters:
        - name: site
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Site detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
              examples:
                default: { $ref: "#/components/examples/SiteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # benches
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.benches.list:
    get:
      tags: [benches]
      operationId: benches_list
      summary: List benches (Frappe Cloud benches have `server` = null)
      parameters:
        - name: provider_account
          in: query
          schema: { type: string }
        - name: server
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Page of benches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchPage" }
              examples:
                default: { $ref: "#/components/examples/BenchPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/method/infra_control.api.benches.get:
    get:
      tags: [benches]
      operationId: benches_get
      summary: Bench detail with its sites and capabilities
      parameters:
        - name: bench
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bench detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchDetail" }
              examples:
                default: { $ref: "#/components/examples/BenchDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # metrics
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.metrics.series:
    get:
      tags: [metrics]
      operationId: metrics_series
      summary: Time series for one metric of one server
      parameters:
        - name: server
          in: query
          required: true
          schema: { type: string }
        - name: metric
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MetricName" }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          required: false
          description: Defaults to the coarsest resolution that keeps the series under 1,000 points.
          schema: { $ref: "#/components/schemas/Resolution" }
      responses:
        "200":
          description: Metric series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeries" }
              examples:
                default: { $ref: "#/components/examples/MetricSeries" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CapabilityMissing" }

  # ---------------------------------------------------------------------------
  # playbooks
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.playbooks.list:
    get:
      tags: [playbooks]
      operationId: playbooks_list
      summary: Playbooks applicable to a target type, filtered by the target's capabilities
      parameters:
        - name: target_doctype
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TargetDoctype" }
        - name: target_name
          in: query
          required: false
          description: When given, only playbooks whose `required_capability` this target supports are returned.
          schema: { type: string }
      responses:
        "200":
          description: Playbooks (not paginated; the catalogue is small)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybookList" }
              examples:
                default: { $ref: "#/components/examples/PlaybookList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # jobs
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.jobs.run:
    post:
      tags: [jobs]
      operationId: jobs_run
      summary: Validate, audit, create an Infra Job and enqueue it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRunRequest" }
            examples:
              migrate:
                value:
                  playbook: site.migrate
                  target_doctype: Site
                  target_name: demo.smartchoice-iq.com
                  params: {}
              delete_site:
                summary: Safe deletion; the last backup is taken first and the Site is archived
                value:
                  playbook: site.delete
                  target_doctype: Site
                  target_name: demo.smartchoice-iq.com
                  params: {}
                  confirm: demo.smartchoice-iq.com
              high_risk:
                value:
                  playbook: server.reboot
                  target_doctype: Server
                  target_name: SRV-0001
                  params: {}
                  confirm: SRV-0001
              provision_server:
                summary: Creation flow; the Server document is created by the job (see Job.created)
                value:
                  playbook: server.provision
                  target_doctype: Provider Account
                  target_name: DO-STAGING
                  params: { hostname: app-03.fra1, region: fra1, size: s-4vcpu-8gb, role: all, tags: [staging] }
              create_site:
                summary: Creation flow; the Site document is created by the job (see Job.created)
                value:
                  playbook: site.create
                  target_doctype: Bench
                  target_name: BENCH-0001
                  params: { domain: erp.client-d.iq, apps: [erpnext], admin_password: "********" }
              update_bench:
                summary: Roll new app code out to every site on a bench (backup + migrate per site)
                value:
                  playbook: bench.update
                  target_doctype: Bench
                  target_name: BENCH-0001
                  params: { apps: [erpnext, smart_features], branch: "", migrate: true, build: true }
      responses:
        "200":
          description: The queued job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
              examples:
                default: { $ref: "#/components/examples/JobEnvelope" }
        "400": { $ref: "#/components/responses/ValidationOrConfirmation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CapabilityMissing" }

  /api/method/infra_control.api.jobs.cancel:
    post:
      tags: [jobs]
      operationId: jobs_cancel
      summary: Cancel a queued or running job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRef" }
      responses:
        "200":
          description: The job after the cancel request (status `Cancelled`, or still `Running` until the worker observes the flag)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /api/method/infra_control.api.jobs.retry:
    post:
      tags: [jobs]
      operationId: jobs_retry
      summary: Create a new job linked to a failed one, resuming from its first failed step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRef" }
      responses:
        "200":
          description: The new job (`retry_of` points at the original)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /api/method/infra_control.api.jobs.list:
    get:
      tags: [jobs]
      operationId: jobs_list
      summary: List jobs, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
        - name: playbook
          in: query
          schema: { type: string }
        - name: target_doctype
          in: query
          schema: { $ref: "#/components/schemas/TargetDoctype" }
        - name: target_name
          in: query
          schema: { type: string }
        - name: bulk_operation
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Page of jobs (without steps)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
              examples:
                default: { $ref: "#/components/examples/JobPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/method/infra_control.api.jobs.get:
    get:
      tags: [jobs]
      operationId: jobs_get
      summary: Job with its steps and masked output
      parameters:
        - name: job
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
              examples:
                default: { $ref: "#/components/examples/JobDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # bulk
  # ---------------------------------------------------------------------------
  /api/method/infra_control.api.bulk.create:
    post:
      tags: [bulk]
      operationId: bulk_create
      summary: Create and start a bulk operation (backup, canary, batches)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkCreateRequest" }
            examples:
              migrate:
                value:
                  playbook: site.migrate
                  targets:
                    - { target_doctype: Site, target_name: demo.smartchoice-iq.com }
                    - { target_doctype: Site, target_name: erp.client-a.iq }
                    - { target_doctype: Site, target_name: erp.client-b.iq }
                  canary_target: { target_doctype: Site, target_name: demo.smartchoice-iq.com }
                  batch_size: 2
                  failure_policy: halt
                  params: {}
      responses:
        "200":
          description: The created bulk operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEnvelope" }
              examples:
                default: { $ref: "#/components/examples/BulkEnvelope" }
        "400": { $ref: "#/components/responses/ValidationOrConfirmation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CapabilityMissing" }

  /api/method/infra_control.api.bulk.pause:
    post:
      tags: [bulk]
      operationId: bulk_pause
      summary: Pause after the current batch finishes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRef" }
      responses:
        "200":
          description: Bulk operation (status `Paused` once the current batch completes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /api/method/infra_control.api.bulk.resume:
    post:
      tags: [bulk]
      operationId: bulk_resume
      summary: Resume a paused or halted bulk operation with the remaining targets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRef" }
      responses:
        "200":
          description: Bulk operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /api/method/infra_control.api.bulk.cancel:
    post:
      tags: [bulk]
      operationId: bulk_cancel
      summary: Cancel a bulk operation; stops after the current target finishes
      description: |
        The target currently running completes (its job is not interrupted); every remaining target
        becomes `Skipped` and the bulk operation ends in status `Cancelled`. Allowed from `Queued`,
        `Running`, `Paused` and `Halted`; otherwise `409 invalid_state`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRef" }
      responses:
        "200":
          description: Bulk operation (status `Cancelled` once the current target completes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /api/method/infra_control.api.bulk.get:
    get:
      tags: [bulk]
      operationId: bulk_get
      summary: Bulk operation with per-target progress
      parameters:
        - name: bulk
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bulk operation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkOperationDetail" }
              examples:
                default: { $ref: "#/components/examples/BulkOperationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/method/infra_control.api.bulk.list:
    get:
      tags: [bulk]
      operationId: bulk_list
      summary: List bulk operations, newest first (summary rows, no targets)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BulkStatus" }
        - name: playbook
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
