---
# site.restore_test (A4.2, security requirement 10): prove a backup restores. The database
# dump is downloaded through a presigned URL into a throwaway site on the same bench, a
# table count proves the data is there, and the throwaway site is dropped whatever happened.
# The real site is never touched. `restore_urls.database` and `probe_site` come from the adapter.
- name: Restore test
  hosts: all
  become: true
  become_user: frappe
  gather_facts: false
  environment:
    PATH: "/home/frappe/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  vars:
    db_admin_cnf: /home/frappe/.config/infra-control/db-admin.cnf
  tasks:
    - name: Preflight
      ansible.builtin.include_tasks: tasks/site_preflight.yml

    - name: Download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: infra-restore-test-
      register: rt_dir

    - name: Download the database backup
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --show-error, --retry, "3", --max-time, "3600", -o, "{{ rt_dir.path }}/database.sql.gz", "{{ restore_urls.database }}"]
      no_log: true
      changed_when: true

    - name: Read the database admin credentials
      ansible.builtin.command: "awk -F= '/^(user|password)=/{print $2}' {{ db_admin_cnf }}"
      register: db_admin
      changed_when: false
      no_log: true

    - name: Restore into a throwaway site, then drop it
      block:
        - name: Create the throwaway site
          ansible.builtin.command:
            argv: [bench, new-site, "{{ probe_site }}", --admin-password, "{{ lookup('password', '/dev/null length=24') }}", --db-root-username, "{{ db_admin.stdout_lines[0] }}", --db-root-password, "{{ db_admin.stdout_lines[1] }}", --no-mariadb-socket]
            chdir: "{{ bench_path }}"
          no_log: true
          changed_when: true

        - name: Restore the backup into it
          ansible.builtin.command:
            argv: [bench, --site, "{{ probe_site }}", restore, "{{ rt_dir.path }}/database.sql.gz", --db-root-username, "{{ db_admin.stdout_lines[0] }}", --db-root-password, "{{ db_admin.stdout_lines[1] }}"]
            chdir: "{{ bench_path }}"
          no_log: true
          changed_when: true

        - name: Probe the restored data
          ansible.builtin.command:
            argv: [bench, --site, "{{ probe_site }}", execute, frappe.db.count, --args, '["User"]']
            chdir: "{{ bench_path }}"
          register: probe
          changed_when: false

        - name: Restored data is readable
          ansible.builtin.assert:
            that: (probe.stdout_lines | last | trim | int) >= 1
            fail_msg: "the restored site has no users: {{ probe.stdout | trim }}"
            quiet: true

        - name: Report
          ansible.builtin.debug:
            msg: "restore test ok: {{ probe.stdout_lines | last | trim }} users in the restored copy"
      always:
        - name: Drop the throwaway site
          ansible.builtin.command:
            argv: [bench, drop-site, "{{ probe_site }}", --db-root-username, "{{ db_admin.stdout_lines[0] }}", --db-root-password, "{{ db_admin.stdout_lines[1] }}", --force, --no-backup]
            chdir: "{{ bench_path }}"
          no_log: true
          failed_when: false
          changed_when: true

        - name: Remove the downloaded dump
          ansible.builtin.file:
            path: "{{ rt_dir.path }}"
            state: absent
