    PlaybookList:
      value:
        items:
          - key: server.provision
            title: Provision server
            description: Creates a droplet in the provider account, runs cloud-init and the base, mariadb, redis, nginx and bench roles. Creates the Server document.
            target_doctype: Provider Account
            creates: Server
            risk: medium
            required_capability: server
            params_schema:
              type: object
              additionalProperties: false
              required: [hostname, region, size]
              properties:
                hostname: { type: string, pattern: "^[a-z0-9.-]{3,63}$" }
                region: { type: string, enum: [fra1, ams3, lon1] }
                size: { type: string, enum: [s-2vcpu-4gb, s-4vcpu-8gb, s-8vcpu-16gb] }
                role: { type: string, enum: [app, db, proxy, all], default: all }
                tags: { type: array, items: { type: string }, default: [] }
          - key: site.create
            title: Create site
            description: Creates a new site on the bench with the given apps. Creates the Site document. Works on both providers.
            target_doctype: Bench
            creates: Site
            risk: low
            required_capability: site
            params_schema:
              type: object
              additionalProperties: false
              required: [domain, admin_password]
              properties:
                domain: { type: string, format: hostname }
                apps: { type: array, items: { type: string }, default: [] }
                admin_password: { type: string, format: password, writeOnly: true, minLength: 12 }
          - key: server.trust_ca
            title: Trust console certificates
            description: Install the controller's console certificate authority on the server so web console sessions can log in with short-lived certificates.
            target_doctype: Server
            creates: null
            risk: low
            required_capability: ssh
            params_schema: { type: object, additionalProperties: false, properties: {} }
          - key: server.deprovision
            title: Deprovision server
            description: Destroy the server at the provider. Refused while it still has live sites; the Server record is archived, not deleted. Requires typed confirmation.
            target_doctype: Server
            creates: null
            risk: high
            required_capability: server
            params_schema: { type: object, additionalProperties: false, properties: {} }
          - key: site.restore_test
            title: Restore test
            description: Restore a backup's database into a throwaway site on the same bench, verify it reads, drop it. The real site is untouched; the backup records the verdict.
            target_doctype: Site
            creates: null
            risk: low
            required_capability: site
            params_schema: { type: object, additionalProperties: false, required: [backup], properties: { backup: { type: string, x-picker: backup } } }
          - key: site.delete
            title: Delete site
            description: Take a last database and files backup offsite (fails if that fails), then drop the site and its vhost. The Site record is archived, not deleted. Requires typed confirmation.
            target_doctype: Site
            creates: null
            risk: high
            required_capability: site
            params_schema: { type: object, additionalProperties: false, properties: {} }
          - key: server.exec
            title: Run command
            description: Run one shell command as the bench user and return its output. Destructive commands are refused; everything is audited.
            target_doctype: Server
            creates: null
            risk: medium
            required_capability: ssh
            params_schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: { type: string, minLength: 1, maxLength: 4000 }
                cwd: { type: string, default: /home/frappe/frappe-bench }
                timeout: { type: integer, minimum: 1, maximum: 600, default: 120 }
          - key: server.logs
            title: Read logs
            description: Tail a log on the server (nginx, MariaDB, Redis, supervisor, system journal, bench, Frappe, database queries, one site), optionally filtered. Read-only.
            target_doctype: Server
            creates: null
            risk: low
            required_capability: ssh
            params_schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: { type: string, enum: [nginx_access, nginx_error, mariadb, redis, supervisor, system, bench_web, bench_worker, bench_schedule, bench_error, frappe, database, site] }
                bench_path: { type: string, default: /home/frappe/frappe-bench }
                site: { type: string, default: "", description: Site domain, for source = site }
                lines: { type: integer, minimum: 1, maximum: 2000, default: 200 }
                match: { type: string, default: "", description: Case-insensitive filter }
          - key: bench.update
            title: Update bench apps
            description: Pull new app code on the bench (fast-forward only), install requirements, then back up and migrate every site on it, build assets and restart.
            target_doctype: Bench
            creates: null
            risk: medium
            required_capability: ssh
            params_schema:
              type: object
              additionalProperties: false
              properties:
                apps: { type: array, items: { type: string }, default: [], description: "Apps to pull; empty = every app on the bench" }
                branch: { type: string, default: "", description: Switch the selected apps to this branch first }
                migrate: { type: boolean, default: true, description: Back up and migrate every site on the bench }
                build: { type: boolean, default: true }
          - key: bench.add_app
            title: Add app to bench
            description: bench get-app from a git repository (optionally a branch) and build its assets. Already present = no-op.
            target_doctype: Bench
            creates: null
            risk: medium
            required_capability: ssh
            params_schema:
              type: object
              additionalProperties: false
              required: [app, repo]
              properties:
                app: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
                repo: { type: string, format: uri, description: "https:// or git@ URL of the app", x-picker: git_repo }
                branch: { type: string, default: "", description: "Branch or tag", x-picker: git_ref }
                connection: { type: string, default: "", description: "Git Connection whose token clones a private repository", x-picker: git_connection }
          - key: site.install_app
            title: Install app on site
            description: Back up, then bench install-app for an app already on the bench. Fails if the backup fails.
            target_doctype: Site
            creates: null
            risk: medium
            required_capability: site
            params_schema:
              type: object
              additionalProperties: false
              required: [app]
              properties:
                app: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
          - key: site.migrate
            title: Migrate site
            description: Takes a backup, then runs bench migrate. Fails if the backup fails.
            target_doctype: Site
            creates: null
            risk: medium
            required_capability: site
            params_schema: { type: object, additionalProperties: false, properties: { skip_search_index: { type: boolean, default: false } } }
          - key: site.backup
            title: Backup site
            description: Database and files backup, uploaded offsite.
            target_doctype: Site
            creates: null
            risk: low
            required_capability: site
            params_schema: { type: object, additionalProperties: false, properties: { with_files: { type: boolean, default: true } } }
          - key: server.reboot
            title: Reboot server
            description: Reboots the droplet. Requires typed confirmation.
            target_doctype: Server
            creates: null
            risk: high
            required_capability: server
            params_schema: { type: object, additionalProperties: false, properties: {} }
