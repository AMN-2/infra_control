---
# site.add_domain (plan 9.2): nginx + certbot (+ DNS, which the adapter sets through the
# DigitalOcean API before this runs when the zone is on the account; `dns_managed`).
# TLS is requested only once the name resolves to this server, so a pending DNS change never
# fails the job; the job output says what to do.
- name: Add a domain
  hosts: all
  become: true
  become_user: frappe
  gather_facts: false
  environment:
    PATH: "/home/frappe/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Preflight
      ansible.builtin.include_tasks: tasks/site_preflight.yml

    - name: Add the domain to the site
      ansible.builtin.command:
        argv: [bench, setup, add-domain, "{{ domain }}", --site, "{{ site }}"]
        chdir: "{{ bench_path }}"
      changed_when: true

    - name: Regenerate the nginx config
      ansible.builtin.command:
        argv: [bench, setup, nginx, --yes]
        chdir: "{{ bench_path }}"
      changed_when: true

    - name: Validate and reload nginx
      become_user: root
      block:
        - name: Validate nginx
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded

    - name: Where does the domain point
      ansible.builtin.command: "getent ahostsv4 {{ domain }}"
      register: domain_lookup
      changed_when: false
      failed_when: false

    - name: This server's public address
      ansible.builtin.command: "curl -s --max-time 5 http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address"
      register: server_ip
      changed_when: false
      failed_when: false

    - name: Request a certificate
      become_user: root
      ansible.builtin.command:
        argv: [certbot, --nginx, --non-interactive, --agree-tos, --register-unsafely-without-email, --redirect, -d, "{{ domain }}"]
      when: server_ip.stdout | length > 0 and server_ip.stdout in domain_lookup.stdout
      changed_when: true

    - name: TLS pending
      ansible.builtin.debug:
        msg: >-
          {{ domain }} does not resolve to this server yet{{ ' (DNS record created; propagation pending)' if dns_managed | default(false) else ' (point an A record at ' ~ server_ip.stdout ~ ')' }}.
          Run site.add_domain again afterwards to issue the certificate.
      when: not (server_ip.stdout | length > 0 and server_ip.stdout in domain_lookup.stdout)
